<style>
/* Layout: one iPhone (Liquid Glass Messages, keyboard up) centred on a soft stage, scaled to fit */
:root{
  --stage:#e9e7f0; --stage-2:#d9d6e6; --ink:#3a3846; --ink-soft:#6d6a7c; --btn:#ffffff; --btn-ink:#1b1a22;
  --ui:-apple-system,"SF Pro Text","SF Pro",system-ui,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--stage:#16151c;--stage-2:#24222e;--ink:#d9d6e4;--ink-soft:#8f8ba0;--btn:#2c2a36;--btn-ink:#f2f0f8;color-scheme:dark}}
:root[data-theme="dark"]{--stage:#16151c;--stage-2:#24222e;--ink:#d9d6e4;--ink-soft:#8f8ba0;--btn:#2c2a36;--btn-ink:#f2f0f8;color-scheme:dark}

html,body{height:100%}
body{margin:0;background:transparent;color:var(--ink);font-family:var(--ui);
  box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden}
/* cropped just above the keyboard, so the compose bar sits at the bottom edge */
#fit{position:relative;flex:0 0 auto;margin-top:auto;clip-path:inset(-80px -80px 0 -80px)}
#phone{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:0 0}
*{box-sizing:border-box}

/* Device frame (screen colours fixed: iMessage light mode) */
.frame{position:absolute;inset:0;border-radius:66px;background:linear-gradient(140deg,#c9c4bc,#8d887f 30%,#d8d3cb 55%,#7f7a72)}
.bezel{position:absolute;inset:4px;border-radius:62px;background:#050505}
.btn-side{position:absolute;background:#a39e96;border-radius:3px}
.screen{position:absolute;inset:12px;border-radius:55px;overflow:hidden;background:#fff;color:#000}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;border-radius:20px;background:#000;z-index:30}

.glass{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);
  box-shadow:0 0 0 .5px rgba(0,0,0,.07),0 6px 18px rgba(0,0,0,.08),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -1px 1px rgba(0,0,0,.03)}

.status{position:absolute;top:0;left:0;right:0;height:54px;display:flex;justify-content:space-between;align-items:center;padding:4px 32px 0 50px;font:600 17px/1 var(--ui);z-index:25}
.status .r{display:flex;gap:6px;align-items:center}

/* floating header */
.topfade{position:absolute;top:0;left:0;right:0;height:150px;z-index:20;pointer-events:none;
  background:linear-gradient(#fff 0,#fff 45%,rgba(255,255,255,.85) 70%,rgba(255,255,255,0));}
.hbtn{position:absolute;top:62px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:22;color:#000}
.hbtn.l{left:16px}.hbtn.r{right:16px}
.who{position:absolute;top:54px;left:50%;transform:translateX(-50%);z-index:22;display:flex;flex-direction:column;align-items:center;gap:0}
.cluster{position:relative;width:64px;height:52px}
.cluster img{position:absolute;border-radius:50%;object-fit:cover;border:1.5px solid #fff}
.pill{margin-top:-6px;position:relative;z-index:2;border-radius:999px;padding:6px 12px;font:600 13px/1 var(--ui);display:flex;gap:3px;align-items:center}
.pill svg{opacity:.4}

/* thread */
.thread{position:absolute;left:0;right:0;top:0;bottom:var(--kb);display:flex;flex-direction:column;justify-content:flex-end;padding:0 14px 66px 12px;gap:2px;overflow:hidden}
.stamp{text-align:center;font:500 11px/1.25 var(--ui);color:#8e8e93;margin:6px 0 6px}
.stamp b{font-weight:600}
.row{display:flex;align-items:flex-end;gap:8px;margin-top:8px;flex:0 0 auto}
.row.out{justify-content:flex-end}
.row img{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.bub{position:relative;max-width:256px;padding:7px 12px 8px;border-radius:19px;font:400 17px/22px var(--ui);letter-spacing:-.25px}
.in .bub{background:#e9e9eb;color:#000}
.out .bub{background:#0b84fe;color:#fff}
.bub::before,.bub::after{content:"";position:absolute;bottom:0;height:20px}
.in .bub::before{left:-7px;width:20px;background:#e9e9eb;border-bottom-right-radius:16px}
.in .bub::after{left:-26px;width:26px;background:#fff;border-bottom-right-radius:10px}
.out .bub::before{right:-7px;width:20px;background:#0b84fe;border-bottom-left-radius:16px}
.out .bub::after{right:-26px;width:26px;background:#fff;border-bottom-left-radius:10px}
.delivered{text-align:right;font:500 11px/1 var(--ui);color:#8e8e93;margin:4px 4px 0 0;flex:0 0 auto}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:8px;height:8px;border-radius:50%;background:#8e8e93;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
.pop{animation:pop .38s cubic-bezier(.2,1.4,.4,1) both}
.out.pop{transform-origin:100% 100%}.in.pop{transform-origin:0 100%}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(12px)}to{opacity:1;transform:none}}

/* floating compose bar */
.bar{position:absolute;left:0;right:0;bottom:calc(var(--kb) + 8px);display:flex;align-items:flex-end;gap:8px;padding:0 12px;z-index:15}
.plus{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;color:#3c3c43}
.field{flex:1;min-width:0;min-height:40px;border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:0 5px 0 15px;font:400 17px/1 var(--ui);color:#a3a3a8}
.field .txt{white-space:nowrap;overflow:hidden}
.field .txt.on{color:#000}
.caret{display:inline-block;width:2px;height:21px;background:#0b84fe;vertical-align:-5px;margin-left:1px;border-radius:1px;animation:car 1s steps(1) infinite}
.txt:not(.on) .caret{margin:0 2px 0 -2px}
@keyframes car{50%{opacity:0}}
.act{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#8e8e93;flex:0 0 auto}
.act .up{display:none}
.act.on{background:#0b84fe;color:#fff}.act.on .up{display:block}.act.on .wave{display:none}

/* keyboard */
.kb{position:absolute;left:0;right:0;bottom:0;height:var(--kb);padding:8px 4px 0;z-index:16;
  background:rgba(214,216,222,.82);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
  border-radius:30px 30px 0 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.sugg{height:40px;display:flex;align-items:center;margin:0 6px 6px}
.sugg span{flex:1;text-align:center;font:400 16px/1 var(--ui);color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.sugg span+span{border-left:1px solid rgba(60,60,67,.18)}
.krow{display:flex;justify-content:center;gap:6px;margin-bottom:11px;padding:0 2px}
.k{position:relative;height:44px;flex:0 0 30px;border-radius:9px;background:#fff;display:grid;place-items:center;font:400 23px/1 var(--ui);color:#000;
  box-shadow:0 1px 0 rgba(0,0,0,.28);transition:background .08s}
.k.sp{background:#abb0ba;font-size:16px}
.k.wide{flex:0 0 44px}.k.mid{flex:0 0 46px;font-size:16px}
.k.space{flex:1 1 auto;font-size:16px}
.k.ret{flex:0 0 92px;font-size:16px}
.k.down{background:#c8ccd4}
.k.sp.down{background:#fff}
.k .pv{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:54px;height:62px;border-radius:12px;background:#fff;
  display:none;align-items:center;justify-content:center;font:400 32px/1 var(--ui);box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:2}
.k.down .pv{display:flex}
.kbfoot{display:flex;justify-content:space-between;align-items:center;padding:4px 22px 0;height:46px;color:#50555c}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:138px;height:5px;border-radius:3px;background:#000;z-index:40}

@media (prefers-reduced-motion: reduce){.pop{animation:none}.typing i,.caret{animation:none}}
</style>

const SCRIPT=[
  {who:"in",av:"a1",text:"Can we meet at the next rest stop?"},
  {who:"out",text:"Which one? Address?",sugg:["Which","Where","What"]},
  {who:"in",av:"a2",text:"Wait! We don't have time for a pit stop, air bnb check in is at 4 :("},
  {who:"out",text:"We here, wya????",sugg:["We","I","Omw"]}
];
const $=id=>document.getElementById(id);
const thread=$('thread'),txt=$('txt'),act=$('act'),sugg=$('sugg');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* build keyboard */
const KEYS={};
const rows=[["q","w","e","r","t","y","u","i","o","p"],["a","s","d","f","g","h","j","k","l"],["⇧","z","x","c","v","b","n","m","⌫"],["123","space","return"]];
rows.forEach(r=>{
  const row=document.createElement('div');row.className='krow';
  r.forEach(c=>{
    const k=document.createElement('div');k.className='k';
    if(c==='⇧'){k.classList.add('sp','wide');k.innerHTML='<svg width="20" height="19" viewBox="0 0 20 19"><path d="M10 1.5 1.8 10H6v7h8v-7h4.2z" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/></svg>';}
    else if(c==='⌫'){k.classList.add('sp','wide');k.innerHTML='<svg width="24" height="17" viewBox="0 0 24 17"><path d="M7.5 1.5H21a1.5 1.5 0 0 1 1.5 1.5v11A1.5 1.5 0 0 1 21 15.5H7.5L1.5 8.5z" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"/><path d="m11 5.5 6 6m0-6-6 6" stroke="#000" stroke-width="1.6" stroke-linecap="round"/></svg>';}
    else if(c==='123'){k.classList.add('sp','mid');k.textContent='123';}
    else if(c==='space'){k.classList.add('space');k.textContent='space';}
    else if(c==='return'){k.classList.add('sp','ret');k.textContent='return';}
    else{k.textContent=c;const pv=document.createElement('span');pv.className='pv';pv.textContent=c;k.append(pv);}
    KEYS[c]=k;row.append(k);
  });
  $('keys').append(row);
});
const shift=KEYS['⇧'];
function setShift(on){shift.style.background=on?'#fff':'';shift.querySelector('path').setAttribute('fill',on?'#000':'none');
  rows.flat().forEach(c=>{if(c.length===1&&/[a-z]/.test(c)){KEYS[c].firstChild.textContent=on?c.toUpperCase():c;KEYS[c].querySelector('.pv').textContent=on?c.toUpperCase():c;}});}

let run=0;
const wait=(ms,id)=>new Promise((res,rej)=>setTimeout(()=>id===run?res():rej('stop'),reduce?Math.min(ms,250):ms));

function fit(){
  const W=393,H=500,f=$('fit'),p=$('phone');
  const s=Math.min(innerWidth/W*0.92,innerHeight/H*0.96);
  p.style.transform=`scale(${s})`;f.style.width=W*s+'px';f.style.height=H*s+'px';
}
addEventListener('resize',fit);fit();

const caret=document.createElement('span');caret.className='caret';
function idle(){txt.classList.remove('on');txt.textContent='';txt.append(caret);txt.append('iMessage');act.classList.remove('on');setSugg(['I','The',"I'm"]);setShift(true);}
function setSugg(a){sugg.innerHTML=a.map(w=>`<span>${w}</span>`).join('');}
function row(who,inner,av){
  const r=document.createElement('div');r.className='row '+who+' pop';
  if(who==='in'){const i=document.createElement('img');i.src=AV[av];i.alt='';r.append(i);}
  r.append(inner);thread.append(r);return r;
}
function bubble(t){const b=document.createElement('div');b.className='bub';b.textContent=t;return b;}
async function press(c,id){
  let key=null;
  if(c===' ')key=KEYS.space;else if(/[a-z]/i.test(c))key=KEYS[c.toLowerCase()];
  if(!key)return;
  key.classList.add('down');await wait(80,id);key.classList.remove('down');
}

async function play(){
  const id=++run;
  thread.querySelectorAll('.row,.delivered').forEach(e=>e.remove());idle();
  try{
    await wait(800,id);
    for(const m of SCRIPT){
      if(m.who==='in'){
        const t=document.createElement('div');t.className='bub typing';t.innerHTML='<i></i><i></i><i></i>';
        const r=row('in',t,m.av);await wait(1300,id);r.remove();
        row('in',bubble(m.text),m.av);
        await wait(1100,id);
      }else{
        txt.classList.add('on');txt.textContent='';txt.append(caret);
        for(let i=0;i<m.text.length;i++){
          const c=m.text[i];
          await press(c,id);
          txt.textContent=m.text.slice(0,i+1);txt.append(caret);
          if(i===0){act.classList.add('on');setShift(false);}
          const word=m.text.slice(0,i+1).split(' ').pop();
          setSugg(word&&/[a-z]/i.test(word)?[`“${word}”`,...m.sugg.slice(1)]:m.sugg);
          await wait(45+Math.random()*45,id);
        }
        await wait(380,id);
        thread.querySelectorAll('.delivered').forEach(e=>e.remove());
        row('out',bubble(m.text));idle();
        const d=document.createElement('div');d.className='delivered';d.textContent='Delivered';thread.append(d);
        await wait(1100,id);
      }
    }
    await wait(3500,id);play();
  }catch(e){}
}

idle();
const io=new IntersectionObserver(es=>{
  if(es.some(e=>e.intersectionRatio>=0.99)){io.disconnect();play();}
},{threshold:[0.99]});
io.observe(document.documentElement);
</script>
